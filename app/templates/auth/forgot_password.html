{% extends "layouts/base.html" %}
{% block title %}Forgot Password — AXIS Trade Flow{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">AXIS TRADE FLOW</h1>
        <p class="auth-subtitle">Password Reset</p>

        <p style="font-size:13px;color:#666;margin:0 0 20px;text-align:center;line-height:1.5;">
            Enter your email address and we'll send you a link to reset your password.
        </p>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus
                       placeholder="trader@firm.com">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Send Reset Link</button>
        </form>

        <div style="text-align:center;margin-top:16px;">
            <a href="{{ url_for('auth.login') }}"
               style="font-size:12px;color:#666;text-decoration:none;">
                &larr; Back to sign in
            </a>
        </div>
    </div>
</div>
{% endblock %}
