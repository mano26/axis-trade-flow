{% extends "layouts/base.html" %}
{% block title %}Set New Password — AXIS Trade Flow{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">AXIS TRADE FLOW</h1>
        <p class="auth-subtitle">Set New Password</p>

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}"
              class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required
                       minlength="8" autofocus placeholder="Minimum 8 characters">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       required minlength="8" placeholder="Re-enter new password">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Update Password</button>
        </form>

        <div style="text-align:center;margin-top:16px;">
            <a href="{{ url_for('auth.login') }}"
               style="font-size:12px;color:#666;text-decoration:none;">
                &larr; Back to sign in
            </a>
        </div>
    </div>
</div>
{% endblock %}
